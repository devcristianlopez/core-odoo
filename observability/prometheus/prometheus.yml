# Prometheus — Core Odoo control plane and host metrics.
#
# Add new scrape targets under `scrape_configs`. Targets must be resolvable
# from the `core-edge` network (service names or container DNS names).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: core-odoo

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: orchestrator
    metrics_path: /metrics
    static_configs:
      - targets:
          - orchestrator:8080

  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets:
          - traefik:8080

  - job_name: docker-exporter
    metrics_path: /metrics
    # Docker 29 + containerd image store breaks cAdvisor's layer lookup; this
    # exporter reads the Docker API and emits the same container_* names.
    scrape_timeout: 14s
    static_configs:
      - targets:
          - docker-exporter:9101

  - job_name: node-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets:
          - prometheus:9090
