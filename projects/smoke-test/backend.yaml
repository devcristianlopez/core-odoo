# Core Odoo BFF contract for the smoke-test fixture (docs/CONTRACT.md §6).
app: smoke-test

odoo:
  url: http://odoo:8069
  # The orchestrator names databases `<project>_<stage>`; this fixture only
  # deploys to `dev` (see scripts/e2e.sh).
  db: smoke_test_dev
  api_key: ${ODOO_API_KEY}
  user: bot

auth:
  # Disposable E2E fixture: the gateway is only reachable through Traefik and
  # the environment is deleted by scripts/e2e.sh. Never use `none` in prod.
  mode: none
  jwt_secret: ${GATEWAY_JWT_SECRET}
  issuer: core-odoo

resources:
  - name: contacts
    model: res.partner
    fields: [name, email, phone, city, nickname]
    operations: [list, read, create, update, delete]
    domain: []
    search_fields: [name, email]
    order: name asc
