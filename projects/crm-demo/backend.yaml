app: crm-demo

odoo:
  url: http://odoo:8069
  db: ${ODOO_DB}
  api_key: ${ODOO_API_KEY}
  user: core_gateway

auth:
  mode: jwt
  jwt_secret: ${GATEWAY_JWT_SECRET}
  issuer: core-odoo

resources:
  - name: leads
    model: crm.demo.lead
    fields: [name, contact_name, email, phone, stage, expected_revenue, notes]
    operations: [list, read, create, update, delete]
    domain: []
    search_fields: [name, contact_name, email]
    order: name asc

  - name: contacts
    model: res.partner
    fields: [name, email, phone, city]
    operations: [list, read, create, update, delete]
    domain: []
    search_fields: [name, email]
    order: name asc
