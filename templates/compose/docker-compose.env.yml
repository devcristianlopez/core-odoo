# Core Odoo — environment stack template.
#
# Rendered by the orchestrator into data/envs/<project>-<stage>/ and started as
# its own Compose project. Every ${PLACEHOLDER} is provided by env.template.
# See docs/CONTRACT.md §2, §3, §7.

name: core-${CORE_PROJECT}-${CORE_STAGE}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-resources: &default-resources
  deploy:
    resources:
      limits:
        memory: ${CORE_MEM_LIMIT:-2g}
        cpus: "${CORE_CPU_LIMIT:-2}"

services:
  db:
    image: postgres:16-alpine
    container_name: core-${CORE_PROJECT}-${CORE_STAGE}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ODOO_DB}
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d ${ODOO_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging
    <<: *default-resources

  odoo:
    image: odoo:20
    container_name: core-${CORE_PROJECT}-${CORE_STAGE}-odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${ODOO_DB}
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_DB: ${ODOO_DB}
      ODOO_INIT_MODULES: ${ODOO_INIT_MODULES:-}
      ODOO_DEMO: ${ODOO_DEMO:-0}
      ODOO_WITHOUT_DEMO: ${ODOO_WITHOUT_DEMO:-all}
      CORE_WORKERS: ${CORE_WORKERS:-0}
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    volumes:
      - odoo_data:/var/lib/odoo
      - filestore:/var/lib/odoo/filestore
      - ${CORE_PROJECT_DIR}/odoo/addons:/mnt/extra-addons:ro
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
    expose:
      - "8069"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8069/web/health', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    logging: *default-logging
    <<: *default-resources

  mailpit:
    image: axllent/mailpit:latest
    container_name: core-${CORE_PROJECT}-${CORE_STAGE}-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "5000"
    expose:
      - "1025"
      - "8025"
    networks:
      - default
    logging: *default-logging
    <<: *default-resources

  gateway:
    build:
      context: ${CORE_REPO_ROOT}/gateway
    image: core-odoo/gateway:${CORE_STAGE}
    container_name: core-${CORE_PROJECT}-${CORE_STAGE}-gateway
    restart: unless-stopped
    depends_on:
      odoo:
        condition: service_started
    environment:
      BACKEND_CONFIG: /app/backend.yaml
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB}
      ODOO_API_KEY: ${ODOO_API_KEY}
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET}
    volumes:
      - ${CORE_PROJECT_DIR}/backend.yaml:/app/backend.yaml:ro
    expose:
      - "8000"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *default-logging
    <<: *default-resources

  frontend:
    build:
      context: ${CORE_PROJECT_DIR}/frontend
    image: core-odoo/frontend-${CORE_PROJECT}:${CORE_STAGE}
    container_name: core-${CORE_PROJECT}-${CORE_STAGE}-frontend
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    expose:
      - "80"
    networks:
      - default
      - core-edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=core-edge
      - traefik.http.routers.${CORE_PROJECT}-${CORE_STAGE}-frontend.entrypoints=web
      - traefik.http.routers.${CORE_PROJECT}-${CORE_STAGE}-frontend.rule=Host(`${CORE_PROJECT}-${CORE_STAGE}.core-odoo.${CORE_DOMAIN_SUFFIX}`)
      - traefik.http.routers.${CORE_PROJECT}-${CORE_STAGE}-frontend.service=${CORE_PROJECT}-${CORE_STAGE}-frontend
      - traefik.http.services.${CORE_PROJECT}-${CORE_STAGE}-frontend.loadbalancer.server.port=80
    logging: *default-logging
    <<: *default-resources

networks:
  default:
    name: core-${CORE_PROJECT}-${CORE_STAGE}_default
    driver: bridge
  core-edge:
    external: true
    name: core-edge

volumes:
  pgdata:
    name: core-${CORE_PROJECT}-${CORE_STAGE}_pgdata
  odoo_data:
    name: core-${CORE_PROJECT}-${CORE_STAGE}_odoo_data
  filestore:
    name: core-${CORE_PROJECT}-${CORE_STAGE}_filestore
