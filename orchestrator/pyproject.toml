[project]
name = "core-odoo-orchestrator"
version = "0.1.0"
description = "Core Odoo control-plane API (Sprint 1)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlmodel>=0.0.22,<1",
  "pydantic-settings>=2.5,<3",
  "argon2-cffi>=23.1,<26",
  "pyjwt>=2.9,<3",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.7,<1",
  "pyyaml>=6.0,<7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["app/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
