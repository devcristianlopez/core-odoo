[project]
name = "core-odoo"
version = "0.1.0"
description = "Core Odoo command line interface"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12,<1",
  "rich>=15,<16",
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7",
  "mcp>=2.3,<3",
]

[project.scripts]
core-odoo = "core_odoo_cli.main:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.7,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_odoo_cli"]
